[package]
name = "difftest"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.97.1"
description = "Differential test harness: Anchor reference build vs kaboom-p (Pinocchio) on LiteSVM"

[dependencies]
# litesvm 0.18.2 needs rustc >= 1.97.1: rust-toolchain.toml pins the installed 1.98.1.
litesvm = "=0.18.2"
agave-feature-set = "~4.3.2"
solana-account = "4.3"
solana-address = { version = "~2.7.0", features = ["decode", "curve25519", "borsh"] }
solana-clock = "~3.2.0"
solana-compute-budget = "~4.3.2"
solana-instruction = "~3.5.0"
solana-instruction-error = "~2.5.0"
solana-message = "4.2.4"
solana-rent = "~4.4.0"
solana-transaction = "4.1.5"
solana-transaction-error = "~3.4.0"
borsh = { version = "1.5", features = ["derive"] }
sha2 = "0.10"
base64 = "0.22"


# Own workspace so the repo-root Anchor workspace never picks this crate up.
[workspace]
resolver = "3"
