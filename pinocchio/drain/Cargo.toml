[package]
name = "kaboom_drain"
version = "0.1.0"
description = "One-shot drain for the PlayKaboom wind-down: closes program-owned accounts to named destinations"
edition = "2021"
license = "MIT"

[lib]
name = "kaboom_drain"
crate-type = ["cdylib", "lib"]

[features]
default = []
no-entrypoint = []

[dependencies]
pinocchio = { version = "0.11.2", default-features = false }
# `decode` = const base58 (`Address::from_str_const`) for AUTHORITY; no runtime cost.
solana-address = { version = "2", default-features = false, features = ["decode"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

# Same profile as ../kaboom-p.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = true

# Own workspace so the repo-root Anchor workspace never picks this crate up.
[workspace]
