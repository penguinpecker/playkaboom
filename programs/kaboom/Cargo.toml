[package]
name = "kaboom"
version = "0.1.0"
description = "PlayKaboom — production-grade provably fair Mines on Solana"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "kaboom"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
sha2 = "0.10"
solana-security-txt = "1.1.1"
ephemeral-rollups-sdk = { version = "0.13.0", features = ["anchor", "disable-realloc"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
