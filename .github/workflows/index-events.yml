name: Index program events
# MIGRATED 2026-05-09: The cron schedule was removed because GH Actions free
# tier was firing every 1-3h instead of the requested 5min, leaving the
# indexer up to 3 hours behind on-chain. The Railway relay
# (apps/realtime/) now polls /api/cron/index-events every 60s as part of
# its always-on container — see CRON_TICK_URL / CRON_TICK_AUTH env on
# the playkaboom-realtime service.
#
# This workflow stays as a manual rescue (workflow_dispatch with
# `reset=true`) for the rare case where the relay needs a backfill push
# from a fresh cursor. Run it via:
#   gh workflow run index-events.yml --repo penguinpecker/playkaboom \
#     --ref main -f reset=true
#
# Requires repo secret CRON_SECRET (must match the value set in Vercel env
# AND the CRON_TICK_AUTH on Railway).

on:
  workflow_dispatch:
    inputs:
      reset:
        description: "Force a full re-scan ignoring the cursor (one-shot backfill)"
        required: false
        default: "false"
        type: boolean

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Hit indexer
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -eu
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET secret not configured" >&2
            exit 1
          fi
          # Hit www directly — playkaboom.gg 307-redirects to www, and following
          # the redirect would strip the Authorization header for cross-host.
          if [ "${{ inputs.reset }}" = "true" ]; then
            URL="https://www.playkaboom.gg/api/cron/index-events?reset=1"
            echo "RESET MODE — full rescan"
          else
            URL="https://www.playkaboom.gg/api/cron/index-events"
          fi
          response=$(curl -sS -w "\nHTTP %{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$URL")
          echo "$response"
          echo "$response" | tail -n1 | grep -q "HTTP 200"
