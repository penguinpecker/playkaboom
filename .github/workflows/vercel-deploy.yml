name: Vercel Deploy

# Auto-deploys every push to main to the kaboomweb3-6280 Vercel account.
# We use this instead of Vercel's native git integration because the new
# Vercel account doesn't have a GitHub Login Connection (architectural
# requirement for the integration that no API token can substitute).
#
# Required GitHub repo secrets (set via `gh secret set <NAME>`):
#   - VERCEL_TOKEN        full-account token from kaboomweb3-6280
#   - VERCEL_ORG_ID       team_eFZwIe4y01ydgOP8AZd5BSf5
#   - VERCEL_PROJECT_ID   prj_WMXQYAhUc6aEWaAiDjvVwFBvP8cW
#
# Why prebuilt: `vercel build --prod` runs locally in this runner so the
# subsequent deploy is just an upload — much faster, plus it produces
# the exact build artifact that lands in production (no separate Vercel-
# side build to debug if something goes wrong).

on:
  # 2026-05-11 hardening: gate prod deploy on CI green-light. Triggered by
  # CI's `workflow_run` completion instead of push directly. If CI fails,
  # this workflow does not fire. The push trigger was removed.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  # One deploy at a time per branch — if a second push comes in mid-build,
  # cancel the older one. Avoids racing two `vercel --prod` calls that
  # could leave the alias on the older deploy.
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Two safeguards:
    # 1) workflow_dispatch always allowed (manual re-deploys, hotfixes).
    # 2) workflow_run only proceeds if the upstream CI run succeeded.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    # All three exported here so every CLI step picks them up automatically —
    # avoids passing --token= inline (GitHub Actions masks the substituted
    # value with ***, which Vercel CLI then rejects as a literal arg).
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        # Pinned major to avoid a compromised "latest" tag shipping straight
        # to prod. Bump deliberately when migrating to a new Vercel feature.
        run: npm install -g vercel@39

      # Upload source + let Vercel build server-side. Mirrors the
      # working manual `vercel --prod` flow exactly. Tried prebuilt
      # (vercel build → vercel deploy --prebuilt) but it fails on the
      # /api/activity/global page-data collection because the local
      # next-build step doesn't have Vercel's runtime context.
      - name: Deploy to production
        run: |
          DEPLOY_URL=$(vercel deploy --prod --yes)
          echo "Deployed to: $DEPLOY_URL"
          echo "::notice title=Deploy::$DEPLOY_URL"
