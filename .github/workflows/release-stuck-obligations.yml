name: Release stuck obligations
# One-shot operator action to release leaked total_outstanding_max_payout
# on the on-chain Vault. Only fixes Won/Lost+!settled GameSession PDAs
# where the encrypted server session row is still in Supabase (the
# operator-fixable subset). See
# /api/admin/release-stuck-obligations/route.ts for full logic.
#
# Trigger:
#   gh workflow run release-stuck-obligations.yml --repo penguinpecker/playkaboom \
#     --ref main -f confirm=I-CONFIRM-RELEASE
#
# 2026-05-11 hardening: the bare workflow_dispatch was a one-click "send a
# real on-chain settle_game tx via the house signer" button — any repo
# admin click triggered it. Now requires an explicit confirm input so the
# operator has to type the exact phrase before the run can proceed.
#
# 2026-05-21: migrated from the shared CRON_SECRET to the per-purpose
# ADMIN_RELEASE_SECRET. This endpoint sends real settle_game txs via the
# house signer — keeping its credential isolated from the routine tick
# and indexer-reset surfaces is good hygiene. Vercel env mirrors the
# GitHub secret name.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'I-CONFIRM-RELEASE' to authorize this run"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify confirm input
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -eu
          if [ "${CONFIRM:-}" != "I-CONFIRM-RELEASE" ]; then
            echo "confirm must be exactly 'I-CONFIRM-RELEASE'" >&2
            exit 1
          fi
      - name: Hit release-stuck-obligations
        env:
          ADMIN_RELEASE_SECRET: ${{ secrets.ADMIN_RELEASE_SECRET }}
        run: |
          set -eu
          if [ -z "${ADMIN_RELEASE_SECRET:-}" ]; then
            echo "ADMIN_RELEASE_SECRET secret not configured" >&2
            exit 1
          fi
          URL="https://www.playkaboom.gg/api/admin/release-stuck-obligations"
          echo "POST $URL"
          # -sS so curl errors print but no progress bar; -w prints status
          # AFTER the body so the JSON response is on stdout for log parsing.
          HTTP=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -X POST "$URL" \
            -H "Authorization: Bearer $ADMIN_RELEASE_SECRET" \
            -H "Content-Type: application/json")
          echo "HTTP $HTTP"
          if [ "$HTTP" != "200" ]; then
            echo "Response body:"
            cat /tmp/resp.json
            exit 1
          fi
          echo "Response:"
          cat /tmp/resp.json | python3 -m json.tool
