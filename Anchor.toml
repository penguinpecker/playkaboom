[toolchain]
anchor_version = "0.31.1"

[features]
resolution = true
skip-lint = false

[programs.localnet]
kaboom = "Kab1TestProgam11111111111111111111111111111"

[programs.devnet]
kaboom = "Kab1TestProgam11111111111111111111111111111"

[programs.mainnet]
