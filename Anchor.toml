[toolchain]
anchor_version = "0.31.1"
# Pin the Agave/Solana build toolchain. Anchor auto-installs this via
# agave-install and builds with its cargo-build-sbf. Agave 3.1.14 defaults to
# platform-tools v1.52 (rust/cargo 1.89.0), which parses the Cargo
# `edition2024` feature now required by transitive deps; the prior default
# (2.1.0 -> platform-tools v1.43 -> cargo 1.79.0) could not.
solana_version = "3.1.14"

[features]
resolution = true
skip-lint = false

[programs.devnet]
kaboom = "4rPEGzWoD2i8k3Pr5tnJsBV7AZEK2zQJCXZe4YgwcixT"

[programs.localnet]
kaboom = "4rPEGzWoD2i8k3Pr5tnJsBV7AZEK2zQJCXZe4YgwcixT"

[programs.mainnet]
kaboom = "9Xip2LRCgC8ucvkYuBQ8jzEsPV74YBnFG1BBeZa98QSh"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
# tsx handles both CommonJS and ESM transparently. tsx is in root devDeps;
# anchor-tests is a workspace ("type":"module") that depends on @playkaboom/sdk
# (also "type":"module"). Running via tsx avoids the ts-node CJS/ESM clash.
test = "npx tsx tests/anchor/runner.ts"

[test]
startup_wait = 5000
shutdown_wait = 2000
upgradeable = false

[test.validator]
bind_address = "0.0.0.0"
url = "https://api.devnet.solana.com"
ledger = ".anchor/test-ledger"
rpc_port = 8899
