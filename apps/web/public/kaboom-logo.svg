<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Kaboom">
  <title>Kaboom</title>

  <defs>
    <radialGradient id="kb-burst-outer" cx="50%" cy="50%" r="55%">
      <stop offset="55%" stop-color="#fda9ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f26aff" stop-opacity="0.85"/>
    </radialGradient>
    <radialGradient id="kb-burst-mid" cx="50%" cy="50%" r="50%">
      <stop offset="50%" stop-color="#a4c9ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.95"/>
    </radialGradient>
    <radialGradient id="kb-burst-inner" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#ecdcff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#d0bcff" stop-opacity="0.95"/>
    </radialGradient>

    <pattern id="kb-halftone" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="2.2" fill="#d0bcff" fill-opacity="0.55"/>
    </pattern>

    <filter id="kb-soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <!-- Halftone dot accents in three corners (mirrors the source artwork) -->
  <g opacity="0.85">
    <path d="M 0 0 L 96 0 Q 96 96 0 96 Z" fill="url(#kb-halftone)"/>
    <path d="M 400 0 L 400 96 Q 304 96 304 0 Z" fill="url(#kb-halftone)"/>
    <path d="M 0 400 L 0 304 Q 96 304 96 400 Z" fill="url(#kb-halftone)"/>
  </g>

  <!-- Comic burst — three layered spiky stars, 12 points each, rotated for spike density -->
  <g transform="translate(200 200)">
    <!-- Outer tertiary burst -->
    <polygon
      points="0,-185 38,-78 156,-90 78,-22 175,55 64,55 38,170 0,75 -38,170 -64,55 -175,55 -78,-22 -156,-90 -38,-78"
      fill="url(#kb-burst-outer)"
      stroke="#5e1f8a"
      stroke-width="3"
      stroke-linejoin="round"
      transform="rotate(8)"/>

    <!-- Middle primary burst -->
    <polygon
      points="0,-145 30,-58 122,-66 60,-15 138,42 50,42 30,135 0,58 -30,135 -50,42 -138,42 -60,-15 -122,-66 -30,-58"
      fill="url(#kb-burst-mid)"
      stroke="#1b0639"
      stroke-width="2"
      stroke-linejoin="round"
      transform="rotate(-6)"/>

    <!-- Inner soft burst (creates halo behind the wordmark) -->
    <polygon
      points="0,-100 22,-36 86,-44 40,-8 96,32 36,30 22,90 0,40 -22,90 -36,30 -96,32 -40,-8 -86,-44 -22,-36"
      fill="url(#kb-burst-inner)"
      transform="rotate(2)"
      filter="url(#kb-soft)"/>
  </g>

  <!-- KABOOM! wordmark
       Drawn as <text> using Space Grotesk Italic Black.
       Falls back to system bold-italic if the font is unavailable
       (e.g., when the SVG is loaded as <img>, fonts from the host page
       won't apply, but a heavy italic system font keeps the silhouette
       roughly on-brand). When inlined as JSX, Space Grotesk renders. -->
  <g transform="translate(200 215)">
    <!-- Drop-shadow / outline pass — magenta offset -->
    <text
      x="3" y="6"
      text-anchor="middle"
      font-family="'Space Grotesk', 'Helvetica Neue', Helvetica, Arial Black, sans-serif"
      font-weight="900"
      font-style="italic"
      font-size="78"
      letter-spacing="-3"
      fill="#5e1f8a"
      stroke="#5e1f8a"
      stroke-width="6"
      stroke-linejoin="round"
      paint-order="stroke">KABOOM!</text>

    <!-- Main fill -->
    <text
      x="0" y="0"
      text-anchor="middle"
      font-family="'Space Grotesk', 'Helvetica Neue', Helvetica, Arial Black, sans-serif"
      font-weight="900"
      font-style="italic"
      font-size="78"
      letter-spacing="-3"
      fill="#ecdcff"
      stroke="#1b0639"
      stroke-width="3"
      stroke-linejoin="round"
      paint-order="stroke">KABOOM!</text>
  </g>
</svg>
